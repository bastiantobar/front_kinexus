<div class="qr-landing-wrapper">

      <img src="assets/kinexus/afiche.jpeg" alt="KI-NEXUS - Kinesiología Preventiva & Bienestar Laboral" class="poster-image" (error)="handleImageError($event)">
    </div>
    <div class="cta-container">
      <a [href]="whatsAppUrl" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">

  </div>
</div>
