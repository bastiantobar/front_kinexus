<section class="kx-page-head">
  <div class="kx-container">
    <p class="kx-eyebrow">Servicios</p>
    <h1 class="kx-page-title">Kinesiología laboral para empresas y kinesiología a domicilio</h1>
    <p class="kx-lead">Programas preventivos para equipos de trabajo y rehabilitación personalizada en tu hogar.</p>
  </div>
</section>

<section class="kx-section" [class.kx-section--alt]="odd" *ngFor="let g of grupos; let odd = odd">
  <div class="kx-container">
    <h2 class="kx-h2 kx-section__head">{{ g.titulo }}</h2>
    <div class="kx-grid kx-grid--3">
      <article class="kx-card kx-service" *ngFor="let s of g.services">
        <img class="kx-service__img" [src]="s.image" [alt]="s.name + ' — ' + s.brief" loading="lazy">
        <div class="kx-service__body">
          <h3 class="kx-h3">{{ s.name }}</h3>
          <p class="kx-muted">{{ s.brief }}</p>
          <div class="kx-service__actions">
            <a class="kx-btn kx-btn--accent" [routerLink]="['/servicios', s.slug]">Conoce más</a>
            <a class="kx-link" routerLink="/contacto" [queryParams]="{ servicio: s.slug }">
              {{ s.audiencia === 'personas' ? 'Solicitar atención' : 'Cotizar' }}
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
